<svg style="color:#142b30;background:#fff;font-family:sans-serif" viewBox="0 0 700 350" role="img" aria-label="バックスピン：速度・揚力・重力の向き" xmlns="http://www.w3.org/2000/svg"><desc>側面図。右をx、上をy、紙面手前をzの正とする。右上へ進み反時計回りに回転する球の通常のマグヌス力は左上向き。抗力は左下、重力は真下。力の矢印の長さは大きさを表さない。</desc><defs><marker id="spin-arrow-magnus" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0 0L6 3L0 6" fill="none" stroke="context-stroke" stroke-width="1.5"></path></marker></defs><circle cx="335" cy="170" r="57" fill="#eaf0e4" stroke="#287365" stroke-width="2"></circle><g fill="none" stroke-width="3" marker-end="url(#spin-arrow-magnus)"><path d="M335 170L500 75" stroke="#287365"></path><path d="M335 170L259 38" stroke="#6953a0"></path><path d="M335 170L203 246" stroke="#9e4f23"></path><path d="M335 170V310" stroke="#142b30"></path><path d="M384 190A53 53 0 1 0 285 155" stroke="#287365"></path></g><g fill="#142b30" font-size="17"><text x="475" y="57">速度 v</text><text x="140" y="35">揚力 L：速度に垂直</text><text x="70" y="271">抗力 D：速度と逆</text><text x="354" y="307">重力 mg</text><text x="407" y="200">ω：+z</text><text x="407" y="224">バックスピン</text></g><path d="M65 320H150M65 320V235" fill="none" stroke="#142b30" stroke-width="2" marker-end="url(#spin-arrow-magnus)"></path><g font-size="16" fill="#142b30"><text x="160" y="325">x</text><text x="45" y="230">y</text><text x="485" y="325">側面図・方向模式図</text></g></svg>
