<svg style="color:#142b30;background:#fff;font-family:sans-serif" viewBox="0 0 700 350" role="img" aria-label="回転を決めるのは、中心から力の作用線までの距離" xmlns="http://www.w3.org/2000/svg"><desc>側面図。中心Cの下側へ右向きの力積Jを与える。作用線と中心の垂直距離bが腕。角力積は紙面手前向きで、反時計回りの回転を生む。</desc><defs><marker id="spin-arrow-impact" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0 0L6 3L0 6" fill="none" stroke="context-stroke" stroke-width="1.5"></path></marker></defs><circle cx="340" cy="155" r="100" fill="#eaf0e4" stroke="#287365" stroke-width="2"></circle><circle cx="340" cy="155" r="4" fill="#142b30"></circle><path d="M80 210H600" stroke="#596a69" stroke-dasharray="5 5" fill="none"></path><path d="M135 210H255" stroke="#9e4f23" stroke-width="4" marker-end="url(#spin-arrow-impact)"></path><path d="M340 155V210M331 155H349M331 210H349" fill="none" stroke="#142b30" stroke-width="2"></path><path d="M284 244A105 105 0 0 0 440 155" fill="none" stroke="#287365" stroke-width="3" marker-end="url(#spin-arrow-impact)"></path><g fill="#142b30" font-size="17"><text x="347" y="149">C（中心）</text><text x="353" y="192">b</text><text x="130" y="192">力積 J →</text><text x="470" y="235">力積の作用線</text><text x="400" y="285">反時計回り</text><text x="70" y="322">腕 b は中心から作用線までの垂直距離</text></g><circle cx="85" cy="70" r="12" fill="none" stroke="#142b30"></circle><circle cx="85" cy="70" r="3" fill="#142b30"></circle><text x="108" y="76" fill="#142b30" font-size="16">+z：紙面手前</text></svg>
