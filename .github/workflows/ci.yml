name: Validate
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true
jobs:
  check:
    timeout-minutes: 15
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run validate
      - run: npx playwright install --with-deps chromium
      - name: Browser checks on production output
        run: npm run test:e2e
      - name: Check project base path
        env:
          BASE_PATH: /long-kick-science
          SITE_URL: https://example.github.io
        run: npm run build && npm run verify:site
      - uses: actions/upload-artifact@v6
        if: failure()
        with:
          name: browser-test-report
          path: |
            playwright-report
            test-results
